<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101014">
  <title>WeTube</title>
  <style>
    :root{color-scheme:dark;--bg:#101014;--panel:#1b1b22;--text:#f5f5f7;--muted:#a5a5b0;--accent:#ff4545;--border:#303039;--field-bg:#101014;--field-border:#41414c;--dialog-shadow:#0009}\n    :root[data-theme="light"]{color-scheme:light;--bg:#f5f5f7;--panel:#fff;--text:#202027;--muted:#666675;--border:#dedee5;--field-bg:#fff;--field-border:#c9c9d2;--dialog-shadow:#0002}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
    header{padding:18px clamp(18px,5vw,64px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px}
    .header-actions{display:flex;align-items:center;gap:12px}
    .theme-button{border:1px solid var(--border);border-radius:9px;background:var(--panel);color:var(--text);font:600 .9rem system-ui;padding:10px 14px;cursor:pointer}\n    .add-button,.submit-button{border:0;border-radius:9px;background:var(--accent);color:white;font:700  .95rem system-ui;padding:11px 17px;cursor:pointer}
    .add-button:hover,.submit-button:hover{filter:brightness(1.12)}
    dialog{width:min(520px,calc(100% - 28px));border:1px solid #393943;border-radius:16px;background:var(--panel);color:var(--text);padding:26px;box-shadow:0 24px 80px var(--dialog-shadow)}
    dialog::backdrop{background:#0008}
    .form-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .form-head h2{margin:0;font-size:1.35rem}
    .close-button{border:0;background:transparent;color:var(--muted);font-size:1.6rem;cursor:pointer}
    .field{display:block;margin:14px 0;color:var(--text);font-size:.92rem;font-weight:600}
    .field input{display:block;width:100%;margin-top:7px;padding:12px;border:1px solid var(--field-border);border-radius:8px;background:var(--field-bg);color:var(--text);font:inherit}
    .form-help{color:var(--muted);font-size:.83rem;margin:4px 0 16px}
    #submit-status{min-height:1.4em;color:var(--muted);font-size:.9rem;margin:12px 0 0}
    #submit-status.error{color:#ff8b8b}
    .submit-button:disabled{opacity:.6;cursor:wait}
    .brand{font-size:1.8rem;font-weight:850;letter-spacing:-1px;color:var(--text);text-decoration:none}.brand span{color:var(--accent)}
    main{max-width:1400px;margin:auto;padding:32px clamp(18px,5vw,64px) 64px}
    h1{font-size:clamp(1.7rem,4vw,2.5rem);margin:0 0 24px}
    #gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:24px}
    .tile{display:block;color:inherit;text-decoration:none;min-width:0}.thumb{aspect-ratio:16/9;background:var(--panel);border-radius:13px;overflow:hidden}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}.tile:hover .thumb img{transform:scale(1.04)}
    .tile h2{font-size:1.05rem;line-height:1.35;margin:11px 2px 0;font-weight:650}
    .status{color:var(--muted);padding:28px 0}.error{color:#ff8b8b}
  </style>
</head>
<body>
  <header><a class="brand" href="./">We<span>Tube</span></a><div class="header-actions"><button class="theme-button" id="theme-toggle" type="button" aria-label="Switch to light mode">☀ מצב בהיר</button><button class="add-button" id="open-add" type="button">＋ הוסף תוכן</button></div></header>
  <dialog id="add-dialog" aria-labelledby="add-heading">
    <div class="form-head"><h2 id="add-heading">Add content</h2><button class="close-button" id="close-add" type="button" aria-label="Close">×</button></div>
    <form id="add-form">
      <label class="field">Title<input name="title" type="text" maxlength="200" placeholder="Video title" required></label>
      <label class="field">Internet Archive video URL<input name="video_url" type="url" placeholder="https://...archive.org/..." required></label>
      <label class="field">Internet Archive image URL<input name="image_url" type="url" placeholder="https://...archive.org/..." required></label>
      <p class="form-help">All three fields are required. Video and image links must be hosted by the Internet Archive.</p>
      <button class="submit-button" id="submit-add" type="submit">Add video</button>
      <p id="submit-status" role="status" aria-live="polite"></p>
    </form>
  </dialog>
  <main>
    <h1>Discover videos</h1>
    <section id="gallery" aria-label="Videos"></section>
    <p id="status" class="status" role="status">Loading videos…</p>
  </main>
  <script>
    function parseCSV(text){
      const rows=[];let row=[],field="",quoted=false;
      for(let i=0;i<text.length;i++){
        const c=text[i],next=text[i+1];
        if(quoted){if(c==='"'&&next==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}
        else if(c==='"')quoted=true;
        else if(c===","){row.push(field);field=""}
        else if(c==="\r"){continue}
        else if(c==="\n"){row.push(field);if(row.some(v=>v.trim()))rows.push(row);row=[];field=""}
        else field+=c;
      }
      row.push(field);if(row.some(v=>v.trim()))rows.push(row);
      return rows;
    }
    function isArchiveURL(raw){
      try{const u=new URL(raw);return (u.protocol==="https:"||u.protocol==="http:")&&(u.hostname==="archive.org"||u.hostname.endsWith(".archive.org"))}catch{return false}
    }
    async function loadVideos(){
      const gallery=document.getElementById("gallery"),status=document.getElementById("status");
      try{
        const controller=new AbortController();
        const timeout=setTimeout(()=>controller.abort(),10000);
        let csvText="";
        try{
          const response=await fetch("https://raw.githubusercontent.com/otizemlanetzag/WeTube/main/DATA.CSV?t="+Date.now(),{cache:"no-store",signal:controller.signal});
          if(!response.ok)throw new Error("GitHub returned HTTP "+response.status+" while loading DATA.CSV.");
          csvText=await response.text();
        }catch(error){
          if(error.name==="AbortError")throw new Error("Loading DATA.CSV timed out. Please try again.");
          throw new Error("Could not load DATA.CSV from GitHub: "+error.message);
        }finally{clearTimeout(timeout)}
        const rows=parseCSV(csvText.replace(/^\uFEFF/,""));
        const videos=rows.slice(1).filter(r=>r.length>=3&&r[0].trim()&&r[1].trim()&&r[2].trim()&&isArchiveURL(r[1].trim())&&isArchiveURL(r[2].trim()));
        if(!videos.length){status.textContent="No valid videos yet. DATA.CSV must contain an Internet Archive video link and an Internet Archive thumbnail link in each row.";return}
        status.hidden=true;
        videos.forEach((r,i)=>{
          const title=r[0].trim(),video=r[1].trim(),image=r[2].trim();
          const link=document.createElement("a");link.className="tile";link.href="./watch.html?id="+i;
          const thumb=document.createElement("div");thumb.className="thumb";
          const img=document.createElement("img");img.src=image;img.alt=title;img.loading="lazy";
          img.onerror=()=>{thumb.style.background="#30303a";img.remove()};
          thumb.append(img);
          const heading=document.createElement("h2");heading.textContent=title;
          link.append(thumb,heading);gallery.append(link);
        });
        sessionStorage.setItem("wetube-videos",JSON.stringify(videos));
      }catch(error){status.textContent=error.message;status.classList.add("error")}
    }
    const themeToggle=document.getElementById("theme-toggle");
    function applyTheme(theme){
      document.documentElement.dataset.theme=theme;
      const light=theme==="light";
      themeToggle.textContent=light?"☾ מצב כהה":"☀ מצב בהיר";
      themeToggle.setAttribute("aria-label",light?"Switch to dark mode":"Switch to light mode");
      document.querySelector('meta[name="theme-color"]').content=light?"#f5f5f7":"#101014";
    }
    let savedTheme="dark";
    try{savedTheme=localStorage.getItem("wetube-theme")||"dark"}catch{}
    applyTheme(savedTheme==="light"?"light":"dark");
    themeToggle.addEventListener("click",()=>{
      const next=document.documentElement.dataset.theme==="light"?"dark":"light";
      applyTheme(next);
      try{localStorage.setItem("wetube-theme",next)}catch{}
    });
    const addDialog=document.getElementById("add-dialog");
    document.getElementById("open-add").addEventListener("click",()=>addDialog.showModal());
    document.getElementById("close-add").addEventListener("click",()=>addDialog.close());
    addDialog.addEventListener("click",event=>{if(event.target===addDialog)addDialog.close()});
    document.getElementById("add-form").addEventListener("submit",async event=>{
      event.preventDefault();
      const form=event.currentTarget,button=document.getElementById("submit-add"),status=document.getElementById("submit-status");
      const data=Object.fromEntries(new FormData(form).entries());
      button.disabled=true;status.className="";status.textContent="Saving video to the gallery…";
      try{
        const response=await fetch("/api/add_video",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
        const result=await response.json().catch(()=>({error:"The server returned an invalid response."}));
        if(!response.ok)throw new Error(result.error||"Could not add the video.");
        status.textContent="Video added! Refreshing the gallery…";
        form.reset();
        setTimeout(()=>location.reload(),700);
      }catch(error){status.className="error";status.textContent=error.message}
      finally{button.disabled=false}
    });
    loadVideos();
  </script>
</body>
</html>
